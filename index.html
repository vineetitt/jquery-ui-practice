<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JQuery UI</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <link
      rel="stylesheet"
      href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css"
    />
    <link rel="stylesheet" href="style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/jQuery-Validation-Engine/2.6.4/validationEngine.jquery.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jQuery-Validation-Engine/2.6.4/languages/jquery.validationEngine-en.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jQuery-Validation-Engine/2.6.4/jquery.validationEngine.min.js"></script>

    <script src="script.js"></script>
  </head>
  <body>
    <h2>jQuery UI Practice</h2>

    <button id="addRecordBtn">Add New Record</button>

    <table id="dataTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Age</th>
          <th>Password</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div id="formDialog" title="Add New Record" style="display: none">
      <form id="recordForm">
        <label>Name:</label><br />
        <input
          type="text"
          id="name"
          required
          class="validate[required, custom[onlyLetterSp]]"
        /><br /><br />

        <label>Email:</label><br />
        <input type="email" id="email" required class="validate[required,custom[email]]"/><br /><br />

        <label>Age:</label><br />
        <input type="number" id="age" required class="validate[required, custom[integer] min[1] max[150] ]"/><br /><br />

        <label>password:</label><br />
        <input type="password" id="password" required class="validate[required, custom[passwordCheck], minSize[6]]" /><br /><br />

        <button type="submit">Save</button>
      </form>
    </div>
  </body>
</html>
